services:
  app:
    build: .
    container_name: url-shortener
    restart: unless-stopped
    environment:
      PORT: 4343
      PSQL_CONN: postgres://urlshortener:xHCF8yneL5So@postgres/url?sslmode=disable
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL}
      OIDC_POST_LOGOUT_URL: ${OIDC_POST_LOGOUT_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - nginx-proxy-network

  postgres:
    image: postgres:16-alpine
    container_name: url-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: xHCF8yneL5So
      POSTGRES_DB: url
    volumes:
      - url-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshortener -d url"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  internal:
    driver: bridge
  nginx-proxy-network:
    external: true

volumes:
  url-postgres-data:
